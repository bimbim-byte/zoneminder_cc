# ============================================================================
# ZoneMinder at the domain ROOT  (https://<server>/  ->  https://<server>/zm/)
#
# Why the alias instead of a rewrite:
#   ZoneMinder v1.36 always emits internal URLs prefixed with "/zm/"
#   (menu links, /zm/cache/*, /zm/cgi-bin/nph-zms). The application does not
#   read the X-Forwarded-Prefix header, so serving it at "/" without a rewrite
#   produces broken links.
#
#   Solution: Apache keeps serving ZM at /zm/ unchanged, and additionally
#   aliases the root so that https://<server>/index.php serves ZM directly.
#   Combined with Caddy's redirect, both of these work:
#     https://<server>/            -> 302 to /zm/
#     https://<server>/zm/...      -> untouched upstream (internal links valid)
#
#   The default vhost keeps DocumentRoot /var/www/html (an empty directory in
#   the upstream image), so these aliases cannot collide with real files.
#
# NOTE: Apache uses LONGEST-PREFIX matching for Alias, and /zm/* aliases are
# declared in zoneminder.conf. Those are longer than the ones here, so they
# always win. Do not add a bare "Alias /" here.
# ============================================================================

# Static assets of ZoneMinder, published at the root so that root-relative
# URLs emitted by index.php (/css/..., /js/..., /graphics/...) still resolve.
# Every entry points into the ZoneMinder docroot, never /var/www/html.
Alias /index.php  /usr/share/zoneminder/www/index.php
Alias /css        /usr/share/zoneminder/www/css
Alias /js         /usr/share/zoneminder/www/js
Alias /fonts      /usr/share/zoneminder/www/fonts
Alias /graphics   /usr/share/zoneminder/www/graphics
Alias /lang       /usr/share/zoneminder/www/lang
Alias /skins      /usr/share/zoneminder/www/skins
Alias /views      /usr/share/zoneminder/www/views
Alias /ajax       /usr/share/zoneminder/www/ajax
Alias /vendor     /usr/share/zoneminder/www/vendor
Alias /includes   /usr/share/zoneminder/www/includes
Alias /robots.txt /usr/share/zoneminder/www/robots.txt

<Directory "/usr/share/zoneminder/www">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>
