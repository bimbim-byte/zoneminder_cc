# ============================================================================
# Zona root ZoneMinder — apa yang HARUS dan TIDAK BOLEH dilakukan
#
# Pelajaran dari pengujian langsung pada ZoneMinder v1.36.32
# (lihat scripts/_auth_probe.sh untuk mereproduksi buktinya):
#
#   ZM_OPT_USE_API=1   + ZM_OPT_USE_AUTH=0   ->  API terbuka tanpa login   (200)
#   ZM_OPT_USE_API=1   + ZM_OPT_USE_AUTH=1   ->  API 401 tanpa token       (aman,
#                                                TAPI UI ZM ikut minta login
#                                                dan password admin saat ini
#                                                TIDAKSAMA dengan ZM_PASS .env)
#
# Artinya: menyalakan ZM_OPT_USE_AUTH=1 pada instalasi yang ada akan langsung
# mengunci dashboard (semua panggilan API jadi 401) sampai password admin ZM
# dinaikkan manual. Karena itu file ini TIDAK mengubah nilai auth. Dashboard
# dilindungi di lapisan reverse proxy (Caddy :9443 + login Flask), bukan di ZM.
#
# Template ini sengaja dikosongkan dari override auth supaya perilaku ZM
# tetap utuh. Bila ingin mengaktifkan auth ZM di masa depan, lakukan lewat
# UI ZoneMinder (Options -> System), bukan lewat file ini.
# ============================================================================
