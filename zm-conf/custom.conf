# ==============================================================================
# Tuning ZoneMinder untuk 100+ kamera (montage view)
# Diterapkan oleh zm-conf/cctv-entrypoint.sh ke tabel Config saat startup.
# Format: Name=Value  (satu per baris, # untuk komentar)
# Nama Config tanpa prefix kanal berlaku untuk semua kanal (H/M/L).
# ==============================================================================

# --- Montage view ---------------------------------------------------------
# JPEG "single" = satu request gambar per kamera, jauh lebih ringan dari stream.
ZM_WEB_STREAM_METHOD=jpeg
ZM_WEB_DEFAULT_SCALE=25
ZM_WEB_SCALE_THUMBS=1

# --- Analisis event (pembunuh CPU saat 100 kamera) -------------------------
# Matikan motion detection berbasis piksel; pakai Modect hanya bila perlu.
ZM_OPT_PIXEL_DIFF=0
ZM_OPT_FAST_DELETE=1
