<IfModule mpm_prefork_module>
    StartServers               8
    MinSpareServers            8
    MaxSpareServers           24
    MaxRequestWorkers        128
    ServerLimit              128
    MaxConnectionsPerChild  1000
</IfModule>
KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 15

# Montage view ZM memuat ratusan stream sekaligus: matikan kompresi untuk
# gambar JPEG agar CPU tidak terpakai percuma.
SetEnv no-gzip 1
