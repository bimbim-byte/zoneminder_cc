# Tuning Apache untuk server 32 core / 32 GB RAM (ZoneMinder + wall dashboard).
# Di-mount ke /etc/apache2/conf-enabled/apache-limit.conf
#
# Catatan: file ini di-Include SETELAH mods-enabled/mpm_prefork.conf,
# sehingga nilai di sini menimpa default modul tersebut.

<IfModule mpm_prefork_module>
    # WAJIB lebih dulu: ServerLimit adalah batas keras jumlah proses.
    # Bila MaxRequestWorkers > ServerLimit, Apache memotong nilai tersebut
    # secara diam-diam (hanya memberi warning). Default ServerLimit = 256.
    ServerLimit               512

    StartServers              16
    MinSpareServers           16
    MaxSpareServers           64

    # Batas atas proses worker. Tiap stream MJPEG memakai 1 worker Apache
    # (ditambah 1 proses zms terpisah). Untuk wall 100 kamera + pengguna web,
    # ~512 sudah lega.
    # Ini BATAS ATAS: Apache menambah proses hanya saat dibutuhkan, dan
    # menyusut kembali sampai MaxSpareServers. Jadi RAM tidak langsung terpakai.
    MaxRequestWorkers         512

    # Daur ulang worker berkala untuk mencegah kebocoran memori pada proses
    # yang melayani stream panjang (0 = tidak pernah didaur ulang).
    MaxConnectionsPerChild    10000
</IfModule>

# KeepAlive wajib untuk streaming MJPEG: cegah buka-tutup koneksi terus menerus.
# 0 = jumlah permintaan tanpa batas per koneksi.
KeepAlive On
MaxKeepAliveRequests 0
KeepAliveTimeout 60
