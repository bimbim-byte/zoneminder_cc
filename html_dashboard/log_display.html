<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Monitor File Log Viewer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            padding: 20px;
        }
        h2 { margin-top: 0; color: #569cd6; }
        .info { font-size: 13px; color: #aaa; margin-bottom: 15px; }
        #log-container {
            background-color: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            height: 550px;
            overflow-y: auto;
            padding: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
        }
        .log-entry { margin-bottom: 8px; padding: 6px; border-bottom: 1px solid #333; word-break: break-all; }
        .time { color: #808080; }
        .topic { color: #ce9178; font-weight: bold; }
        .payload { color: #b5cea8; }
    </style>
</head>
<body>

    <h2>MQTT Monitor Log Viewer (10 Hari Retensi)</h2>
    <div class="info">
        * Data diambil dari API Flask <code>/api/mqtt-logs</code> yang membaca file log MQTT. Log yang berumur lebih dari 10 hari otomatis dibersihkan.
    </div>

    <div id="log-container">Memuat log dari server...</div>

    <script>
        // Menggunakan relative URL ke API endpoint Flask yang sama
        const API_URL = "/api/mqtt-logs";
        const logContainer = document.getElementById("log-container");

        async function fetchLogsFromFile() {
            try {
                const response = await fetch(API_URL);
                const logs = await response.json();

                if (!Array.isArray(logs) || logs.length === 0) {
                    logContainer.innerHTML = "<em>Belum ada log tersimpan.</em>";
                    return;
                }

                let htmlContent = "";
                logs.forEach(item => {
                    htmlContent += `
                        <div class="log-entry">
                            <span class="time">[${escapeHtml(item.timestamp)}]</span> 
                            <span class="topic">${escapeHtml(item.topic)}</span>: 
                            <span class="payload">${escapeHtml(item.payload)}</span>
                        </div>
                    `;
                });

                logContainer.innerHTML = htmlContent;
            } catch (error) {
                logContainer.innerHTML = `<span style="color:#f44747;">Gagal terhubung ke Flask API Log (${API_URL}). Pastikan server berjalan.</span>`;
            }
        }

        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        fetchLogsFromFile();
        // Auto-refresh log tiap 2 detik
        setInterval(fetchLogsFromFile, 2000);
    </script>
</body>
</html>
