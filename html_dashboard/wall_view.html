<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wall Dashboard - Live Grid</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #2563eb; --bg: #0b1120; --card: #111c33; --border: #263349;
    --text: #e2e8f0; --muted: #8fa3bf; --accent: #22d3ee;
    --ok: #22c55e; --off: #ef4444; --warn: #f59e0b;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: var(--bg); overflow: hidden;
  }

  /* ---------- TOOLBAR ---------- */
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: #0e1830; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  header h1 { font-size: 14.5px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .pill { font-size: 11.5px; padding: 3px 9px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); color: var(--muted); }
  .spacer { flex: 1; }
  .ctrl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  select, input[type=number] {
    padding: 6px 9px; font-size: 12.5px; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 6px; outline: none;
  }
  select:focus, input:focus { border-color: var(--primary); }
  .icon-btn {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; color: var(--muted); background: var(--card);
    border: 1px solid var(--border); border-radius: 7px; transition: .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--primary); }
  .icon-btn.active { color: #fff; background: var(--primary); border-color: var(--primary); }
  .btn {
    padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: #fff;
    background: var(--card); border: 1px solid var(--border); border-radius: 7px; transition: .15s;
  }
  .btn:hover { border-color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); }

  /* ---------- GRID ---------- */
  .grid-wrap { height: calc(100vh - 57px); overflow-y: auto; padding: 10px; }
  .grid { display: grid; gap: 8px; }
  .tile {
    position: relative; overflow: hidden; background: #060b16;
    border: 1px solid var(--border); border-radius: 8px;
    aspect-ratio: var(--tile-ar, 16 / 9); transition: border-color .18s;
  }
  .tile.live { border-color: var(--ok); }
  .tile.offline { border-color: var(--off); }
  .tile img { width: 100%; height: 100%; object-fit: contain; display: block; background: #060b16; }

  .tile-placeholder {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 12px;
    background: linear-gradient(135deg, #0b1425, #060b16);
  }
  .tile-placeholder .spinner {
    width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tile-label {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 6px;
    padding: 5px 8px; font-size: 11.5px; background: linear-gradient(transparent, rgba(0,0,0,.85));
  }
  .tile-label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .tile-label .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .tile-label .dot.off { background: var(--off); }
  .tile-label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile-idx { font-size: 10.5px; color: var(--muted); padding: 2px 5px; background: rgba(0,0,0,.6); border-radius: 4px; }
  .tile-tools { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity .18s; }
  .tile:hover .tile-tools { opacity: 1; }
  .tile-tools button {
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; cursor: pointer; color: #fff; background: rgba(0,0,0,.7);
    border: 1px solid rgba(255,255,255,.18); border-radius: 5px;
  }
  .tile-tools button:hover { background: var(--primary); }

  /* Fullscreen single camera */
  .tile.fullscreen {
    position: fixed; inset: 0; z-index: 999; aspect-ratio: auto; border-radius: 0;
    border: none; background: #000;
  }
  body.fs .grid-wrap { overflow: hidden; }

  .status-msg { padding: 40px; text-align: center; color: var(--muted); font-size: 13.5px; }
</style>
</head>
<body>

<header>
  <h1>🖥️ Wall Dashboard <span class="pill" id="srcPill">memuat...</span></h1>
  <span class="pill" id="countPill">0 kamera</span>
  <div class="spacer"></div>

  <div class="ctrl">
    <label for="cols">Kolom</label>
    <select id="cols">
      <option value="0">Auto</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6" selected>6</option>
      <option value="8">8</option>
      <option value="10">10</option>
    </select>
  </div>

  <div class="ctrl">
    <label for="ratio">Rasio</label>
    <select id="ratio">
      <option value="16 / 9">16:9</option>
      <option value="4 / 3">4:3</option>
      <option value="1 / 1">1:1</option>
      <option value="21 / 9">21:9</option>
    </select>
  </div>

  <div class="ctrl">
    <label for="scale">Resolusi</label>
    <select id="scale">
      <option value="240">240 px</option>
      <option value="320" selected>320 px</option>
      <option value="480">480 px</option>
      <option value="640">640 px</option>
      <option value="0">Asli</option>
    </select>
  </div>

  <div class="ctrl">
    <label for="fps">FPS</label>
    <select id="fps">
      <option value="2">2</option>
      <option value="5" selected>5</option>
      <option value="10">10</option>
      <option value="15">15</option>
      <option value="0">Maks</option>
    </select>
  </div>

  <div class="ctrl">
    <label for="conc">Stream</label>
    <select id="conc" title="Jumlah stream yang berjalan bersamaan">
      <option value="4">4</option>
      <option value="6" selected>6</option>
      <option value="9">9</option>
      <option value="12">12</option>
      <option value="16">16</option>
    </select>
  </div>

  <button class="icon-btn" id="btnLabels" title="Tampilkan/sembunyikan nama kamera">🏷️</button>
  <button class="icon-btn" id="btnPause" title="Jeda semua stream">⏸️</button>
  <button class="btn" id="btnReload" title="Muat ulang semua stream">↻ Reload</button>
  <button class="btn" onclick="location.href='/wall'">← Pilih</button>
</header>

<div class="grid-wrap" id="wrap">
  <div class="status-msg" id="statusMsg">Memuat daftar kamera...</div>
  <div class="grid" id="grid"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);

let cameras = [];
let paused = false;
let showLabels = true;
const loaded = new Set();
let observer = null;

function streamUrl(id) {
  const scale = $('scale').value;
  const fps = $('fps').value;
  const q = [];
  if (scale && scale !== '0') q.push(`scale=${scale}`);
  if (fps && fps !== '0') q.push(`maxfps=${fps}`);
  return `/api/cameras/stream/${id}` + (q.length ? '?' + q.join('&') : '');
}

function applyGrid() {
  const cols = $('cols').value;
  const ratio = $('ratio').value;
  const grid = $('grid');
  grid.style.gridTemplateColumns = cols === '0'
    ? 'repeat(auto-fill, minmax(260px, 1fr))'
    : `repeat(${cols}, minmax(0, 1fr))`;
  document.documentElement.style.setProperty('--tile-ar', ratio);
}

/* Lazy-load: kamera hanya fetch stream saat masuk viewport.
   Ini kunci agar 100 kamera tidak membebani ZoneMinder & browser. */
function setupObserver() {
  if (observer) observer.disconnect();
  observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const tile = entry.target;
      const id = tile.dataset.id;
      if (entry.isIntersecting) {
        if (!paused) requestStream(tile, id);
      } else if (!tile.dataset.keep) {
        // Kamera keluar viewport -> bebaskan slot untuk kamera lain.
        releaseStream(tile, id);
      }
    });
  }, { root: $('wrap'), rootMargin: '0px' });
}

/* Lazy-load dengan batas konkurensi.
   Browser hanya mengizinkan ~6 koneksi HTTP/1.1 per host, dan ZoneMinder
   membebani CPU per stream. Jadi kita batasi jumlah stream aktif, sisanya
   menunggu antrean sampai slot bebas. */
const MAX_CONCURRENT_DEFAULT = 6;
const queue = [];
let activeCount = 0;
let MAX_CONCURRENT = MAX_CONCURRENT_DEFAULT;

function pumpQueue() {
  while (activeCount < MAX_CONCURRENT && queue.length) {
    const job = queue.shift();
    if (!job.tile.isConnected) continue;
    startStream(job.tile, job.id);
  }
}

function requestStream(tile, id) {
  if (loaded.has(id)) return;
  loaded.add(id);              // tandai agar tidak dobel antre
  queue.push({ tile, id });
  pumpQueue();
}

function startStream(tile, id) {
  const img = document.createElement('img');
  img.alt = tile.dataset.name;
  img.src = streamUrl(id);

  const ph = tile.querySelector('.tile-placeholder');
  if (ph) ph.remove();

  activeCount++;
  tile.classList.add('live');

  img.addEventListener('error', () => {
    tile.classList.remove('live');
    tile.classList.add('offline');
    const dot = tile.querySelector('.dot');
    if (dot) dot.className = 'dot off';
    activeCount = Math.max(0, activeCount - 1);
    loaded.delete(id);
    pumpQueue();
  });

  tile.prepend(img);
}

function releaseStream(tile, id) {
  if (!loaded.has(id)) return;
  const img = tile.querySelector('img');
  const wasActive = !!img;
  if (img) {
    img.removeAttribute('src');
    img.remove();
  }
  loaded.delete(id);
  tile.classList.remove('live');
  if (!tile.querySelector('.tile-placeholder')) {
    tile.insertAdjacentHTML('afterbegin', placeholderHtml());
  }
  if (wasActive) {
    activeCount = Math.max(0, activeCount - 1);
    pumpQueue();
  } else {
    // Masih menunggu di antrean: buang job-nya
    const i = queue.findIndex(j => j.id === id);
    if (i >= 0) queue.splice(i, 1);
  }
}

function placeholderHtml() {
  return '<div class="tile-placeholder"><div class="spinner"></div><span>menunggu tampil</span></div>';
}

function render() {
  const grid = $('grid');
  grid.innerHTML = '';
  loaded.clear();
  queue.length = 0;
  activeCount = 0;
  setupObserver();

  if (!cameras.length) {
    $('statusMsg').style.display = 'block';
    $('statusMsg').textContent = 'Tidak ada kamera untuk ditampilkan. Kembali dan pilih ulang.';
    return;
  }
  $('statusMsg').style.display = 'none';

  const frag = document.createDocumentFragment();
  cameras.forEach((cam) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.id = cam.id;
    tile.dataset.name = cam.name;
    tile.innerHTML = `
      ${placeholderHtml()}
      <div class="tile-tools">
        <button title="Layar penuh" data-act="fs">⛶</button>
        <button title="Muat ulang" data-act="reload">↻</button>
      </div>
      <div class="tile-label" ${showLabels ? '' : 'style="display:none"'}>
        <span class="dot ${cam.enabled && cam.function !== 'None' ? 'on' : 'off'}"></span>
        <span title="${escapeHtml(cam.name)}">${escapeHtml(cam.name)}</span>
        <span class="tile-idx">#${cam.id}</span>
      </div>`;

    tile.querySelector('[data-act="fs"]').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFullscreen(tile);
    });
    tile.querySelector('[data-act="reload"]').addEventListener('click', (e) => {
      e.stopPropagation();
      releaseStream(tile, cam.id);
      requestStream(tile, cam.id);
    });

    frag.appendChild(tile);
    observer.observe(tile);
  });

  grid.appendChild(frag);
}

function toggleFullscreen(tile) {
  const isFs = tile.classList.contains('fullscreen');
  document.querySelectorAll('.tile.fullscreen').forEach(t => {
    t.classList.remove('fullscreen');
    if (t !== tile) t.dataset.keep = '';
  });
  document.body.classList.remove('fs');
  if (!isFs) {
    tile.classList.add('fullscreen');
    document.body.classList.add('fs');
    tile.dataset.keep = '1';
    requestStream(tile, tile.dataset.id);
  } else {
    tile.dataset.keep = '';
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.tile.fullscreen').forEach(t => {
      t.classList.remove('fullscreen');
      t.dataset.keep = '';
    });
    document.body.classList.remove('fs');
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function fetchCameras() {
  const mode = params.get('mode') || 'all';
  let url;
  if (mode === 'groups') {
    const gids = params.get('groups') || '';
    $('srcPill').textContent = `Group: ${gids.split(',').filter(Boolean).length} dipilih`;
    url = `/api/cameras/wall?mode=groups&groups=${encodeURIComponent(gids)}`;
  } else if (mode === 'ids') {
    const ids = params.get('ids') || '';
    $('srcPill').textContent = 'Kamera terpilih';
    url = `/api/cameras/wall?mode=ids&ids=${encodeURIComponent(ids)}`;
  } else {
    $('srcPill').textContent = 'Seluruh kamera';
    url = '/api/cameras/wall?mode=all';
  }

  try {
    const res = await fetch(url);
    const data = await res.json();
    cameras = data.cameras || [];
    $('countPill').textContent = `${cameras.length} kamera`;
    document.title = `Wall - ${cameras.length} Kamera`;
    render();
  } catch (e) {
    $('statusMsg').textContent = `Gagal memuat kamera: ${e.message}`;
  }
}

/* ---------- EVENT BINDINGS ---------- */
$('cols').addEventListener('change', applyGrid);
$('ratio').addEventListener('change', applyGrid);

/* Resolusi/FPS berubah -> muat ulang hanya stream yang sedang aktif */
function reloadVisible() {
  Array.from(document.querySelectorAll('.tile'))
    .filter(tile => tile.querySelector('img'))
    .forEach(tile => {
      releaseStream(tile, tile.dataset.id);
      requestStream(tile, tile.dataset.id);
    });
}

$('scale').addEventListener('change', reloadVisible);
$('fps').addEventListener('change', reloadVisible);

$('conc').addEventListener('change', () => {
  MAX_CONCURRENT = Math.max(1, parseInt($('conc').value, 10) || MAX_CONCURRENT_DEFAULT);
  rebuildGrid();
});

/* Indikator jumlah stream aktif vs menunggu di antrean */
setInterval(() => {
  const pill = $('countPill');
  if (!pill || paused) return;
  const base = `${cameras.length} kamera`;
  pill.textContent = queue.length
    ? `${base} · live ${activeCount} · antre ${queue.length}`
    : `${base} · live ${activeCount}`;
}, 1500);

/* Susun ulang grid: kamera di luar layar dibebaskan, slot dipakai yang terlihat */
function rebuildGrid() {
  if (paused) return;
  document.querySelectorAll('.tile').forEach(tile => {
    const r = tile.getBoundingClientRect();
    const visible = r.top < window.innerHeight && r.bottom > 0;
    if (visible) requestStream(tile, tile.dataset.id);
    else releaseStream(tile, tile.dataset.id);
  });
}

$('btnLabels').addEventListener('click', () => {
  showLabels = !showLabels;
  $('btnLabels').classList.toggle('active', showLabels);
  document.querySelectorAll('.tile-label').forEach(l => l.style.display = showLabels ? '' : 'none');
});

$('btnPause').addEventListener('click', () => {
  paused = !paused;
  $('btnPause').textContent = paused ? '▶️' : '⏸️';
  $('btnPause').classList.toggle('active', paused);
  if (paused) {
    document.querySelectorAll('.tile').forEach(tile => releaseStream(tile, tile.dataset.id));
  } else {
    rebuildGrid();
  }
});

$('btnReload').addEventListener('click', () => {
  if (paused) return;
  document.querySelectorAll('.tile').forEach(tile => releaseStream(tile, tile.dataset.id));
  queue.length = 0;
  rebuildGrid();
});

applyGrid();
$('btnLabels').classList.add('active');
fetchCameras();
</script>
</body>
</html>
