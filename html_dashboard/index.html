<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Interface — Central Camera Management Portal</title>
    <style>
      :root {
        --primary-color: #1e293b;
        --primary-dark: #0f172a;
        --accent-color: #2563eb;
        --success-color: #16a34a;
        --purple-color: #7c3aed;
        --bg-color: #f1f5f9;
        --card-bg: rgba(255, 255, 255, 0.96);
        --text-color: #334155;
        --muted-color: #64748b;
        --border-color: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text-color);
        background: radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 35%), radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.08), transparent 35%), var(--bg-color);
        display: flex;
        flex-direction: column;
      }

      header {
        position: relative;
        padding: 34px 24px;
        text-align: center;
        color: #fff;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #334155 100%);
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.18);
        overflow: hidden;
      }

      header::before,
      header::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }

      header::before {
        width: 260px;
        height: 260px;
        top: -180px;
        left: -70px;
        background: rgba(255, 255, 255, 0.05);
      }

      header::after {
        width: 300px;
        height: 300px;
        right: -100px;
        bottom: -220px;
        background: rgba(255, 255, 255, 0.04);
      }

      header h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(22px, 4vw, 30px);
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      header p {
        margin: 7px 0 0;
        font-size: 13px;
        opacity: 0.8;
      }

      .container {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 56px 24px 70px;
      }

      .portal-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }

      .portal-card {
        position: relative;
        min-height: 310px;
        padding: 30px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-top: 4px solid var(--accent-color);
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(15, 23, 42, 0.06), 0 2px 5px rgba(15, 23, 42, 0.03);
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      }

      .portal-card::after {
        content: "";
        position: absolute;
        width: 150px;
        height: 150px;
        right: -70px;
        top: -70px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.025;
        pointer-events: none;
      }

      .portal-card:hover {
        transform: translateY(-7px);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12), 0 5px 12px rgba(15, 23, 42, 0.05);
      }

      .portal-card:active {
        transform: translateY(-3px);
      }

      .portal-card.zm {
        border-top-color: var(--success-color);
      }

      .icon {
        width: 68px;
        height: 68px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        border-radius: 16px;
        background: #eff6ff;
        box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.08);
      }

      .portal-card:nth-child(1) .icon {
        background: #f5f3ff;
        box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.08);
      }

      .portal-card.zm .icon {
        background: #f0fdf4;
        box-shadow: inset 0 0 0 1px rgba(22, 163, 74, 0.08);
      }

      .title {
        margin-bottom: 10px;
        color: var(--primary-color);
        font-size: 20px;
        line-height: 1.3;
        font-weight: 700;
        letter-spacing: -0.2px;
      }

      .desc {
        max-width: 290px;
        margin: 0 0 28px;
        color: var(--muted-color);
        font-size: 14px;
        line-height: 1.6;
      }

      .btn-enter {
        width: 100%;
        padding: 12px 18px;
        display: block;
        color: #fff;
        background: var(--accent-color);
        border-radius: 9px;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
        box-shadow: 0 5px 12px rgba(37, 99, 235, 0.18);
        transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
      }

      .portal-card:hover .btn-enter {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      .portal-card.zm .btn-enter {
        background: var(--success-color);
        box-shadow: 0 5px 12px rgba(22, 163, 74, 0.18);
      }

      @media (max-width: 900px) {
        .portal-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 620px) {
        header {
          padding: 28px 18px;
        }

        .container {
          padding: 34px 18px 50px;
        }

        .portal-grid {
          grid-template-columns: 1fr;
          gap: 18px;
        }

        .portal-card {
          min-height: 280px;
          padding: 25px;
        }

        .icon {
          width: 60px;
          height: 60px;
          margin-bottom: 20px;
          font-size: 30px;
        }

        .title {
          font-size: 19px;
        }
      }

      @media (prefers-reduced-motion: reduce) {

        .portal-card,
        .btn-enter {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎥 Home - Camera</h1>
      <p></p>
    </header>
    <div class="container">
      <div class="portal-grid">
        <!-- Kartu Menu Baru di index.html -->
        <a href="unified_add.html" class="portal-card" style="border-top-color: #6f42c1;">
          <div>
            <div class="icon">⚡</div>
            <div class="title"> Single-Click for Dual Registration </div>
            <div class="desc"> Mendaftarkan kamera RTSP sekaligus ke MediaMTX dan ZoneMinder. </div>
          </div>
          <div class="btn-enter" style="background: #6f42c1;"> Open &rarr; </div>
        </a>
        <!-- Menu 1: MediaMTX -->
        <a href="mediamtx.html" class="portal-card">
          <div>
            <div class="icon">📡</div>
            <div class="title"> MediaMTX </div>
            <div class="desc"> Kelola RTSP Stream Relay. </div>
          </div>
          <div class="btn-enter"> Open &rarr; </div>
        </a>
        <!-- Menu 2: ZoneMinder -->
        <a href="zoneminder.html" class="portal-card zm">
          <div>
            <div class="icon">🛡️</div>
            <div class="title"> CRUD ZoneMinder (api) </div>
            <div class="desc"> Kelola NVR ZoneMinder (v1.36). </div>
          </div>
          <div class="btn-enter"> Open &rarr; </div>
        </a>
      </div>
    </div>
  </body>
</html>
