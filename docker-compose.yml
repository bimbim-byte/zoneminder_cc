services:

  # Konfigurasi dibaca dari file .env (lihat .env.example).
  # Nilai setelah ":?error" WAJIB ada; compose berhenti dengan pesan jelas
  # bila variabel belum diisi, alih-alih diam-diam memakai password default.

  # --------------------------------------------------------
  # 1. Reverse Proxy & Auto-SSL (Caddy)
  # --------------------------------------------------------
  caddy-proxy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: always
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp" # HTTP/3 (QUIC) support
      - "${DASHBOARD_HTTPS_PORT:-9443}:9443" # Dashboard manajemen (terpisah dari root)
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cctv_net
    depends_on:
      - zoneminder
      - ui-interface

  # --------------------------------------------------------
  # 2. ZoneMinder (NVR Core)
  # --------------------------------------------------------
  zoneminder:
    # Image turunan yang menyalin tuning MySQL & Apache ke dalam image.
    # Lihat zm-conf/Dockerfile untuk alasan tidak memakai bind mount.
    build:
      context: ./zm-conf
      dockerfile: Dockerfile
    image: zoneminder_tuned:latest
    container_name: zoneminder
    restart: always

    # Shared memory untuk buffer frame tiap kamera (~9 MB per monitor @720p).
    # 8 GB memberi ruang lega untuk 100+ kamera dan lonjakan saat motion terdeteksi.
    shm_size: "8g"

    # ZoneMinder membuka banyak file descriptor (monitor + event + shared memory).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # PENTING: port ZM TIDAK lagi dipublikasikan ke host.
    # Sebelumnya "${ZONEMINDER_PORT:-8082}:80" mengikat 0.0.0.0:8082 dan
    # memberi jalur bypass langsung ke ZoneMinder (melewati HTTPS + login).
    # Semua akses ZM sekarang lewat Caddy: https://<server>/  (publik)
    # dan https://<server>:9443/zm/ (dari dashboard).
    # Untuk debugging internal: "docker exec zoneminder curl -s localhost/zm/".
    expose:
      - "80"

    environment:
      - TZ=Asia/Jakarta
      - PHP_TIMEZONE=Asia/Jakarta

    volumes:
      - zoneminder_events:/var/lib/zoneminder/events
      - zoneminder_images:/var/lib/zoneminder/images
      - zoneminder_mysql:/var/lib/mysql

    networks:
      - cctv_net

  # --------------------------------------------------------
  # 3. Camera Management Dashboard (UI Interface)
  # --------------------------------------------------------
  ui-interface:
    build:
      context: ./html_dashboard
      dockerfile: Dockerfile
    container_name: camera-dashboard
    restart: always

    # PENTING: port dashboard TIDAK dipublikasikan ke host.
    # Sebelumnya "${DASHBOARD_PORT:-8080}:8080" mengikat 0.0.0.0:8080 dan
    # menjadi jalur bypass yang melewati HTTPS + login (semua endpoint API,
    # termasuk pembaca konfigurasi, bisa dipanggil langsung).
    # Dashboard kini HANYA dapat dijangkau lewat Caddy pada port 9443.
    # Gunakan "docker exec camera-dashboard ..." untuk debugging internal.
    expose:
      - "8080"

    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
      - ZM_HOST=http://zoneminder:80
      # Kredensial ZM: dashboard mengelolanya sendiri lewat
      # data/zm_credentials.enc (lihat Pengaturan). Dua variabel di bawah
      # hanya dipakai sebagai nilai AWAL saat file itu belum ada.
      - ZM_USER=${ZM_USER:-admin}
      - ZM_PASS=${ZM_PASS:-}
      - DASH_SECRET_KEY=${DASH_SECRET_KEY:?DASH_SECRET_KEY belum diisi di file .env}
      - ZM_CREDENTIALS_FILE=/app/data/zm_credentials.enc
      - DASH_USERS_FILE=/app/data/dashboard_users.json
      - MQTT_LOG_FILE=/app/data/mqtt_logs.json
      - WSGI_THREADS=${WSGI_THREADS:-64}

    volumes:
      - ./html_dashboard:/app
      - ./data:/app/data

    networks:
      - cctv_net

    depends_on:
      - zoneminder

  # --------------------------------------------------------
  # 4. Mosquitto MQTT Broker
  # --------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_broker
    restart: always

    ports:
      - "${MQTT_TCP_PORT:-1883}:1883"   # Port MQTT TCP
      - "${MQTT_WS_PORT:-9001}:9001"    # Port MQTT WebSocket

    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # File password wajib ada: allow_anonymous=false di mosquitto.conf
      # akan membuat broker GAGAL START bila file ini tidak ditemukan.
      - ./mosquitto_config/passwd:/mosquitto/config/passwd:ro

    networks:
      - cctv_net

  # --------------------------------------------------------
  # 5. Camera Health Checker & MQTT Reporter Service
  # --------------------------------------------------------
  cctv-checker:
    build:
      context: ./cctv_checker
      dockerfile: Dockerfile
    container_name: cctv_checker_service
    restart: always

    environment:
      - PYTHONUNBUFFERED=1
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - MQTT_TOPIC=cctv/#
      # Broker menolak koneksi anonim. Nilai harus sama dengan user yang
      # dibuat di ./mosquitto_config/passwd.
      - MQTT_USER=${MQTT_USER:-cctv}
      - MQTT_PASS=${MQTT_PASS:?MQTT_PASS belum diisi di file .env}
      - ZM_HOST=http://zoneminder:80
      - ZM_USER=${ZM_USER:?ZM_USER belum diisi di file .env}
      - ZM_PASS=${ZM_PASS:?ZM_PASS belum diisi di file .env}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-600}
      - RTSP_TIMEOUT=${RTSP_TIMEOUT:-3.0}
      - RETENTION_DAYS=${RETENTION_DAYS:-10}
      - CHECKER_ENABLED=${CHECKER_ENABLED:-false}
      - MQTT_LOG_FILE=/app/data/mqtt_logs.json
      - CHECKER_CONFIG_FILE=/app/data/checker_config.json

    volumes:
      - ./cctv_checker:/app
      - ./data:/app/data

    networks:
      - cctv_net

    depends_on:
      - mosquitto
      - zoneminder

# --------------------------------------------------------
# Networks & Volumes
# --------------------------------------------------------
networks:
  cctv_net:
    driver: bridge

volumes:
  zoneminder_events:
  zoneminder_images:
  zoneminder_mysql:
  caddy_data:
  caddy_config:
