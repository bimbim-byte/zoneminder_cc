# ============================================================
# Mosquitto - konfigurasi aman untuk ZoneMinder Central CCTV
# ============================================================
# allow_anonymous DIMATIKAN: broker hanya menerima klien yang
# memakai kredensial dari password_file. Tanpa ini, siapa pun di
# port 1883/9001 bisa membaca cctv/events (termasuk URL RTSP).
#
# File password dibuat dengan:
#   docker compose exec mosquitto mosquitto_passwd -b /mosquitto/config/passwd <user> <pass>
# atau dari host (lihat PANDUAN_PENGGUNAAN.md).

allow_anonymous false
password_file /mosquitto/config/passwd

# --- TCP (aplikasi / checker) ---
listener 1883 0.0.0.0
protocol mqtt

# --- WebSocket (browser) ---
listener 9001 0.0.0.0
protocol websockets

# Batasi beban agar broker tidak bisa dijadikan target DoS sederhana.
max_connections 200
max_queued_messages 500
max_packet_size 262144
persistence false
